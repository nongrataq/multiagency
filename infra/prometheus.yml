global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: app
    static_configs:
      - targets: ['app:9100']
  - job_name: ollama-health
    static_configs:
      - targets: ['monitor:9101']
